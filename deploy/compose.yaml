services:
  app:
    image: ghcr.io/hollesse/muenzling:main
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.muenzling.rule: Host(`muenzling.jtoepfer.de`) || Host(`muenzling.lan.jtoepfer.de`)
      traefik.http.services.muenzling.loadbalancer.server.port: "80"
    networks: [proxy]

networks:
  proxy:
    external: true
