<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff6d8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Münzling</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span>🪙</span>
        <div>
          <b>Münzling</b><small id="childBankLabel">Beim Münzling</small>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Elternbereich">
        ⚙️
      </button>
    </header>
    <main>
      <section id="home" class="view active">
        <div class="hero">
          <div class="tiny" id="moneyOwnerLabel">BEIM MÜNZLING 🪙</div>
          <div id="balance" class="balance">0,00 €</div>
          <div id="nextInterest" class="pill">
            ✨ Sonntag wachsen meine Münzen
          </div>
        </div>
        <h2>Was ist mein Geld wert?</h2>
        <div id="valueChoices" class="value-choices"></div>
        <div id="valueResult" class="value-result"></div>
        <div class="money-places">
          <div class="place-card">
            <span class="place-emoji">👧</span><b>Bei mir</b
            ><small>Geld zum Ausgeben</small>
          </div>
          <div class="place-arrow">↔</div>
          <div class="place-card active-place">
            <span class="place-emoji">🪙</span
            ><b id="savedPlaceLabel">Beim Münzling</b
            ><small>Dein Geld bleibt deins</small>
          </div>
        </div>
        <div class="quick">
          <button id="depositBtn">➡️🪙<span>Zum Münzling</span></button
          ><button id="withdrawBtn">🪙➡️👧<span>Zu mir</span></button>
        </div>
      </section>
      <section id="sunday" class="view">
        <div class="sun">☀️</div>
        <h1>Sonntag!</h1>
        <div id="sundayContent"></div>
      </section>
      <section id="book" class="view">
        <div class="book-head">📕 <b id="bookTitle">Mein Münzling-Buch</b></div>
        <div id="ledger" class="ledger"></div>
      </section>
      <section id="growth" class="view">
        <h1>📈 Mein Geld wächst</h1>
        <div class="interest-total">
          <span id="interestLabel">✨ Vom Münzling geschenkt</span
          ><b id="interestTotal">0,00 €</b>
        </div>
        <div class="chart-wrap">
          <canvas id="chart" width="800" height="420"></canvas>
        </div>
      </section>
    </main>
    <nav>
      <button data-view="home" class="active">🪙<span>Münzling</span></button
      ><button data-view="sunday">🪙<span>Sonntag</span></button
      ><button data-view="book">📕<span>Buch</span></button
      ><button data-view="growth">📈<span>Wachsen</span></button>
    </nav>
    <dialog id="moneyDialog">
      <form method="dialog" class="dialog-card">
        <button class="close" value="cancel">×</button>
        <div id="moneyDialogBody"></div>
      </form>
    </dialog>
    <dialog id="parentDialog">
      <div class="dialog-card parent">
        <button class="close" id="parentClose">×</button>
        <div id="parentBody"></div>
      </div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
